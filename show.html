<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Show — Pascal Anderson</title>
<meta name="description" content="Concert photography by Pascal Anderson.">
<meta name="theme-color" content="#050505">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff2ec4'/%3E%3C/svg%3E">

<!-- Fonts are self-hosted — see index.html for why. -->
<link rel="preload" href="/fonts/SpaceGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/SpaceMono-Regular.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>

<div class="vignette" aria-hidden="true"></div>

<a href="#main-content" class="skip-link">Skip to content</a>

<header class="nav">
  <a href="/#top" class="nav__logo">Pascal Anderson</a>
  <nav class="nav__links">
    <a href="/#work">Work</a>
    <a href="/#shows">Shows</a>
    <a href="/#contact">Contact</a>
  </nav>
</header>

<main id="main-content">
  <section class="show-head">
    <a class="show-head__back" href="/#shows"><span aria-hidden="true">←</span> All shows</a>
    <h1 class="show-head__title" id="showTitle">&nbsp;</h1>
    <p class="show-head__meta" id="showMeta"></p>
    <p class="show-head__text" id="showText" hidden></p>
  </section>

  <section class="personal-gallery">
    <div class="gallery" id="showGallery"></div>
  </section>

  <nav class="show-next" id="showNext" aria-label="Next show" hidden>
    <a class="show-next__link" id="showNextLink" href="/#shows">
      <span class="show-next__label">Next show</span>
      <span class="show-next__title" id="showNextTitle"></span>
    </a>
  </nav>
</main>

<!-- LIGHTBOX — same markup/behavior as the main site's; arrows step
     through the photos of THIS show only. -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox__close" id="lightboxClose" aria-label="Close">Close <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous photo"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next photo"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <div class="lightbox__stage" id="lightboxStage">
    <div class="lightbox__ph" id="lightboxPh">
      <img class="tile__img" id="lightboxImg" alt="" loading="eager" decoding="async">
    </div>
  </div>
  <p class="lightbox__caption" id="lightboxCaption"></p>
</div>

<footer class="footer">
  <span>© <span id="year"></span> Pascal Anderson</span>
  <div class="footer__links">
    <a href="/">Back to site</a>
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
  </div>
</footer>

<script src="/show.js?v=4"></script>
</body>
</html>
