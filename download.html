<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Deine Bilder — Pascal Anderson</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>

<div class="vignette" aria-hidden="true"></div>

<header class="nav">
  <a href="/#top" class="nav__logo">Pascal Anderson</a>
</header>

<main class="legal portal">
  <div class="legal__inner">
    <p class="portal__eyebrow">Client delivery</p>
    <h1 class="legal__title" id="portalTitle">Deine Bilder</h1>
    <p class="legal__intro" id="portalIntro">Einen Moment — deine Dateien werden geladen …</p>

    <p class="portal__note" id="portalNote" hidden></p>

    <div class="portal__error" id="portalError" role="alert" hidden>
      <h2 class="portal__error-title" id="portalErrorTitle"></h2>
      <p id="portalErrorText"></p>
    </div>

    <div class="portal__bar" id="portalBar" hidden>
      <div class="portal__bar-actions">
        <button type="button" class="portal__btn" id="selectModeBtn" aria-pressed="false">Auswählen</button>
        <button type="button" class="portal__btn" id="selectAllBtn">Alle auswählen</button>
      </div>
      <p class="portal__count" id="selectCount" aria-live="polite"></p>
      <button type="button" class="portal__btn portal__btn--primary" id="downloadBtn">Alle herunterladen</button>
    </div>

    <ul class="portal__grid" id="portalGrid" hidden></ul>

    <p class="portal__status" id="downloadStatus" role="status" hidden></p>

    <p class="portal__meta" id="portalMeta" hidden></p>
  </div>
</main>

<footer class="footer">
  <span>© <span id="year"></span> Pascal Anderson</span>
  <div class="footer__links">
    <a href="/">Back to site</a>
    <a href="/impressum">Impressum</a>
    <a href="/datenschutz">Datenschutz</a>
  </div>
</footer>

<script src="/download.js?v=2"></script>
</body>
</html>
